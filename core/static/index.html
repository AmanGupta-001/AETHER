<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <script src="/static/lib_files/marked.min.js?v=2"></script>
    <script src="/static/ui_elements/settings.js?v=2"></script>
    <script src="/static/ui_elements/chatHistoryList.js?v=2"></script>
    <script src="/static/chat.js?v=2"></script>
    <script src="/static/recording.js?v=2"></script>
    <script src="/static/socketEvents.js?v=2"></script>
    <script src="/static/index.js?v=2" defer></script>
    <script src="/static/eventlisteners.js?v=2"></script>
    <link rel="stylesheet" href="/static/index.css?v=2">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="/static/resources/favicon.ico">
    <title>Aether</title>
</head>
<body>
    <div id="settingsPage"></div>

    <header>
        <h2 class="heading russo-one-regular" id="jarvis">AETHER</h2>
        <div class="toolbar">
            <image id="settingsButton" class="icon" src="./static/resources/settings.png" onclick="settingsPage()"></image>
        </div>
    </header>

    <div class="mainContent">
        <div class="chatHistory"></div>

        <div class="chat">
            <div id="chat_history_container">
                <div name="chat_list" id="chat_list"></div>
                <div name="history" id="chat_history"></div>
            </div>

            <div class="chat_input_container">
                <div id="chat_input">
                    <textarea id="chat_input_text" placeholder="Type a message to Aether..."></textarea>
                    <button id="voice_button">🎤</button>
                </div>
            </div>
            <button id="send_button">Send</button>
            <p style="display:inline;margin-left:12px;">Parse AI output</p>
            <input id="checkbox" style="margin-left:12px;" type="checkbox" checked>
            <button id="clear_log">Clear chat log</button>
        </div>

        <div class="processesContainer">
            <p style="margin-top:36px">Debug &amp; running Aether processes</p>
        </div>
    </div>

    <div class="linebreak"></div>
    <footer>
        <label>Permissions and licensing:</label>
        <a href="https://fonts.google.com/specimen/Russo+One/license#permission-conditions">Russo font license.</a>
    </footer>
</body>
</html>
